objective: "Prepare, verify, tag, and publish Kujo CMD 0.2.0 with current Command Code integration and release documentation."
checklist_file: ""
max_iterations: 4
max_no_progress: 2
max_consecutive_failures: 3

allowed_actions:
  - read_files
  - edit_files
  - run_tests
  - commit_local_changes
  - publish_release

blocked_actions:
  - deploy
  - destructive_cleanup
  - production_config_change

eval_gates:
  - id: unit_release_tests
    command: "npm test"
    required: true
  - id: package_e2e
    command: "npm run test:e2e"
    required: true
  - id: command_code_host
    command: "COMMAND_CODE_EXPECTED_VERSION=1.75.1 npm run test:command-code"
    required: true
  - id: diff_check
    command: "git diff --check -- CHANGELOG.md README.md assets catalog docs lib scripts tests"
    required: true
  - id: package_dry_run
    command: "npm pack --dry-run"
    required: true
  - id: shipcheck_gate
    command: "cd ../shipcheck && kujo run shipcheck.kujo gate --dir ../kujo-cmd --format json"
    required: true

commit:
  enabled: true
  strategy: small_meaningful
  push: true

memory:
  enabled: true
  provider: strata
  project: "Agent Notes"
  mode: consolidate
  retrieval_tests: true
